name: Release

# Publica una versión: compila el binario y crea la release de GitHub con el
# .exe y su SHA-256. Se dispara al empujar una etiqueta vX.Y.Z, o a mano desde
# la pestaña Actions indicando la etiqueta.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Etiqueta a publicar (p. ej. v0.1.0)'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Compilar y publicar
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Determinar la etiqueta
        id: tag
        shell: pwsh
        # La etiqueta llega por variable de entorno: el contexto `inputs` no
        # existe cuando el disparador es un push, y referenciarlo tumbaría el
        # flujo antes de empezar.
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          $tag = if ($env:INPUT_TAG) { $env:INPUT_TAG } else { $env:GITHUB_REF_NAME }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$($tag.TrimStart('v'))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Instalar toolchain de Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup target add x86_64-pc-windows-msvc
          rustup default stable

      - name: Pruebas
        working-directory: RustShell
        run: cargo test --target x86_64-pc-windows-msvc

      - name: Compilar en release
        working-directory: RustShell
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Preparar los archivos de la release
        id: pack
        shell: pwsh
        run: |
          $out = 'RustShell\target\x86_64-pc-windows-msvc\release'
          New-Item -ItemType Directory -Force dist | Out-Null
          New-Item -ItemType Directory -Force dist\installer | Out-Null
          # Los cuatro ejecutables del entorno.
          $exes = 'OptimizedShell.exe', 'OptimizedExplorer.exe', 'OptimizedTaskmgr.exe', 'OptimizedLogonUI.exe'
          foreach ($e in $exes) { Copy-Item (Join-Path $out $e) (Join-Path 'dist' $e) }
          Copy-Item README.md dist\README.md
          Copy-Item LICENSE dist\LICENSE
          Copy-Item installer\install.ps1 dist\installer\install.ps1
          Copy-Item installer\uninstall.ps1 dist\installer\uninstall.ps1
          # Un .sha256 por ejecutable (el de OptimizedShell.exe es el que
          # comprueba --update) y uno con todos juntos.
          foreach ($e in $exes) {
            $h = (Get-FileHash (Join-Path 'dist' $e) -Algorithm SHA256).Hash
            "$h  $e" | Out-File (Join-Path 'dist' "$e.sha256") -Encoding ascii
            "$h  $e" | Out-File dist\SHA256SUMS.txt -Encoding ascii -Append
          }
          $hash = (Get-FileHash dist\OptimizedShell.exe -Algorithm SHA256).Hash
          $size = '{0:N0}' -f ((Get-ChildItem (($exes | ForEach-Object { Join-Path 'dist' $_ })) | Measure-Object Length -Sum).Sum)
          Compress-Archive -Path dist\OptimizedShell.exe, dist\OptimizedExplorer.exe, dist\OptimizedTaskmgr.exe, dist\OptimizedLogonUI.exe, dist\README.md, dist\LICENSE, dist\installer -DestinationPath "dist\OptimizedShell-${{ steps.tag.outputs.tag }}-x86_64-windows.zip"
          "hash=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "size=$size" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Crear la release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Here-string literal: PowerShell no interpreta nada de lo que hay
          # dentro; las expresiones de GitHub ya vienen sustituidas.
          $notes = @'
          Shell y utilidades ligeras para Windows 10/11 en Rust sobre Win32 + GDI+.

          **Cuatro ejecutables independientes** (${{ steps.pack.outputs.size }} bytes en total), sin dependencias ni VC++ redist:

          | Ejecutable | Para qué |
          |---|---|
          | `OptimizedShell.exe` | barra de tareas, menú Inicio, escritorio y router de todos los modos |
          | `OptimizedExplorer.exe` | explorador de archivos (`OptimizedExplorer.exe [ruta]`) |
          | `OptimizedTaskmgr.exe` | administrador de tareas (`OptimizedTaskmgr.exe [pestaña]`) |
          | `OptimizedLogonUI.exe` | pantalla de bloqueo e inicio de sesión (`--lock`, `--logon`, `--demo`) |

          **Instalador**: `installer\install.ps1` (dentro del .zip) copia el entorno a `%ProgramFiles%\OptimizedShell`, crea los accesos del menú Inicio, registra las rutas de aplicación y la entrada de «Programas instalados», y con `-AsShell` deja OptimizedShell como shell del usuario. `installer\uninstall.ps1` lo deshace y devuelve el Explorador de Windows.

          El binario principal sigue aceptando todos los modos de siempre:

          | Modo | Comando |
          |---|---|
          | Barra de tareas (shell) + menú Inicio | `OptimizedShell.exe` |
          | Administrador de tareas | `--taskmgr [rendimiento\|inicio\|servicios]` |
          | Explorador de archivos | `--explorer [ruta]` |
          | Bloqueo / inicio de sesión | `--lock` · `--logon` |
          | Configuración | `--settings [pagina]` |
          | Instalar / desinstalar como shell | `--install` · `--uninstall` |
          | Buscar e instalar actualizaciones | `--update [--silent\|--forzar]` |

          | Lanzar una notificación | `--notify "Título\|Mensaje"` |

          **Escritorio y atajos**: ventana de escritorio con el papel tapiz del usuario (se omite sola si el Explorador sigue siendo el shell), atajos globales (`Win+E`, `Win+R`, `Win+I`, `Win+D`, `Win+N`, `Win+L`, `Ctrl+Mayús+Esc`, `Ctrl+Esc`) y programas anclados al menú Inicio.

          **Explorador**: operaciones de archivo con `IFileOperation` (papelera, progreso, confirmaciones y deshacer), portapapeles CF_HDROP compatible con el Explorador de Windows, arrastrar y soltar, selección múltiple, renombrado en la fila, actualización automática con `ReadDirectoryChangesW` y menú contextual propio con acceso al del shell.

          **Administrador de tareas**: pestaña **Servicios** (iniciar, detener, reiniciar y tipo de inicio), icono por proceso y menú con prioridad, modo de eficiencia (EcoQoS) y afinidad de procesadores.

          **Bandeja**: iconos de las aplicaciones que usan `Shell_NotifyIcon`, y mosaicos que encienden y apagan de verdad las radios Wi-Fi y Bluetooth.

          **Configuración**: galería de fondos con miniaturas y página de Pantalla propia (resolución, frecuencia y orientación, probando el modo antes de aplicarlo).

          **Barra de tareas**: botón Inicio con el logotipo de Windows (`shell32.dll`), a la izquierda o centrado como en Windows 11; botones de ventana con el icono real de cada aplicación; y **área de notificación** con volumen, red (Wi-Fi con intensidad y SSID, o Ethernet), batería, Bluetooth y campana de avisos. Al pulsar cualquier icono se abre el panel de **Configuración rápida** (mosaicos de red, Bluetooth, No molestar y tema, deslizador de volumen y estado del equipo).

          **Notificaciones**: avisos emergentes con cierre automático, centro de notificaciones con historial y No molestar, avisos propios de batería baja y de caída de la red, y `--notify` para que cualquier script avise al usuario.

          **Configuración al estilo de Windows 11**: buscador que filtra todos los ajustes, página de inicio con la tarjeta del equipo y categorías (Sistema, Bluetooth y dispositivos, Red e Internet, Personalización, Barra de tareas, Menú Inicio, Aplicaciones, Accesibilidad y Acerca de), con información en vivo del equipo y accesos a las páginas de Windows.

          Incluye también la pestaña **Rendimiento** del administrador (CPU total y por núcleo, memoria, GPUs con nombre y VRAM, y temperatura de las zonas térmicas ACPI) y el **menú Inicio estilo Windows 7**: programas más usados, «Todos los programas», búsqueda en vivo y columna derecha con carpetas, Equipo, Panel de control y apagado.

          **Iconos del escritorio** (nuevo en 0.5.0): los esenciales (Este equipo, carpeta del usuario, Papelera de reciclaje con su icono de vacía o llena, Red y Panel de control) y todo lo que haya en las carpetas `Escritorio` del usuario y la pública, con el icono real del shell en tamaño grande. Se manejan como en el Explorador: selección simple y múltiple, doble clic para abrir, `F2` renombrar, `Supr` eliminar, `Ctrl+C`/`X`/`V`, `F5` y el menú contextual del shell. Cada icono esencial tiene su interruptor, y hay ajustes de tamaño, rótulos, orden, archivos ocultos y refresco automático (`ReadDirectoryChangesW`).

          **Liberar RAM** (nuevo en 0.5.0): botón en la pestaña Procesos que recorta el conjunto de trabajo de todos los procesos accesibles y, con elevación, vacía también las listas de memoria en espera y modificada del sistema, diciendo cuánto se ha liberado. El menú de cada proceso tiene la misma opción solo para ese proceso.

          El **«Proceso inactivo del sistema»** (PID 0) ya no se lista entre los procesos: no es un proceso, sino la cuenta del tiempo que la CPU pasa sin trabajo, y por eso salía al 99 %. Su valor se enseña como *Inactivo* en los datos de la CPU. Y el ajuste **Confirmar al eliminar** ya pregunta de verdad antes de borrar, en el explorador y en el escritorio.

          **Autoactualización desde GitHub** (nuevo en 0.6.0): `--update` busca la última release, comprueba el SHA-256 del ejecutable contra el `.sha256` publicado y sustituye el `OptimizedShell.exe` en caliente (el que está en uso se aparta a `.old` y se borra en el siguiente arranque; si era el shell, la barra se reinicia ya con la versión nueva). En **Configuración › Acerca de › Actualizaciones** están la versión instalada, el botón de buscar ahora, el interruptor de comprobación automática al arrancar y cada cuántos días se comprueba. La comprobación automática va en un hilo de baja prioridad y solo avisa: no instala nada sin permiso. Todo con WinHTTP y BCrypt por FFI propia, sin dependencias nuevas.

          **La Configuración original de Windows 11 ya se abre de verdad con OptimizedShell como shell** (corregido en 0.6.0): los enlaces `ms-settings:` seguían sin abrir nada cuando no había un `explorer.exe` de sesión, porque `ShellExecuteW` resuelve los protocolos de las aplicaciones empaquetadas apoyándose en el shell del sistema. Ahora la Configuración se activa directamente con `IApplicationActivationManager`, que vive en un servidor COM propio de Windows y funciona sin Explorador; si eso falla, se prueba `SystemSettings.exe` de `%WinDir%\ImmersiveControlPanel` y, como último recurso, `explorer.exe`. Afecta a la Configuración propia, al área de notificación y a los clics en volumen, red, Bluetooth y batería.

          **Ajustes del sistema nativos, sin `ms-settings:`** (nuevo en 0.7.0): todo lo que la Configuración delegaba antes en la Configuración de Windows se lee y se escribe ahora con la API del sistema, en listas con botones que actúan al momento. **Energía**: planes de `powrprof` con el activo marcado, tiempos de apagado de pantalla y de suspensión con corriente y con batería, suspender e hibernar. **Sonido** (página nueva): dispositivos de salida y de entrada de Core Audio, cambio del predeterminado con `IPolicyConfig`, volumen y silencio. **Bluetooth**: radios detectadas y dispositivos emparejados con su clase y su estado, y desemparejar. **Impresoras**: `EnumPrinters`, predeterminada y cola de impresión. **Ratón y teclado**: velocidad del puntero, líneas de la rueda, doble clic, botones intercambiados, tamaño del puntero, velocidad y retardo de repetición, grosor e intermitencia del cursor y distribución activa. **Red**: adaptadores con su IP, puerta de enlace, DHCP y MAC, redes Wi-Fi al alcance con su señal (`wlanapi`: explorar, conectar con un perfil guardado y desconectar) y vaciar la caché de DNS. **Aplicaciones**: programas instalados leídos del registro (editor, versión y tamaño) con su desinstalador, y aplicación predeterminada de los tipos y protocolos más usados. **Accesibilidad**: contraste alto, teclas especiales, filtro y de alternancia, puntero con el teclado, avisos en pantalla, lupa, narrador y teclado en pantalla. **Pantalla de bloqueo**: la imagen de la de Windows (`PersonalizationCSP`, con permiso de administrador) y la propia. Y un grupo de **herramientas clásicas** (administrador de dispositivos, discos, visor de eventos, tareas, directivas, registro, limpieza, información del sistema, cuentas y restauración). Todo con FFI propia y COM a mano, sin dependencias nuevas.

          **Iconos anclados en la barra de tareas** (nuevo en 0.7.0): los programas anclados se dibujan siempre entre el botón Inicio y los botones de ventana, con el icono real del shell. Pulsarlos abre el programa o, si ya está abierto, trae su ventana al frente (y la minimiza al volver a pulsar); un punto bajo el icono avisa de que está en ejecución y el subrayado de acento, de que es la ventana en primer plano. El botón derecho da «Abrir», «Ejecutar como administrador», «Abrir la ubicación», «Cerrar la ventana» y «Desanclar»; sobre un botón de ventana aparece además «Anclar a la barra de tareas». Se guardan por ruta y en orden en `%APPDATA%\OptimizedShell\taskbar.ini`, y en **Configuración › Barra de tareas › Iconos anclados** se pueden anclar con «Examinar...», reordenar y desanclar, además de esconderlos, mantener el icono con el programa abierto o cambiar su tamaño.

          **Un ejecutable por herramienta** (nuevo en 0.8.0): el explorador de archivos, el administrador de tareas y la pantalla de bloqueo son ahora `OptimizedExplorer.exe`, `OptimizedTaskmgr.exe` y `OptimizedLogonUI.exe`. Todo el código vive en una biblioteca común (`optimized_shell`) y cada binario es un `main` mínimo, así que cada ventana es su propio proceso: solo ocupa memoria mientras está abierta y un fallo en el explorador no se lleva por delante la barra de tareas. La barra, el escritorio y los menús lanzan el ejecutable de cada herramienta cuando está instalado al lado, y `OptimizedShell.exe` sigue aceptando todos los flags de siempre (`--explorer`, `--taskmgr`, `--lock`...) para quien prefiera un binario único.

          **Instalador** (nuevo en 0.8.0): `installer\install.ps1` se eleva solo, copia el entorno a `%ProgramFiles%\OptimizedShell` (apartando a `.old` lo que esté en uso), crea los accesos del menú Inicio, registra las rutas de aplicación —`OptimizedExplorer` se puede escribir en Ejecutar— y la entrada de «Programas instalados» con su desinstalador, y con `-AsShell` deja OptimizedShell como shell del usuario. `installer\uninstall.ps1` devuelve el Explorador de Windows, cierra el entorno y limpia accesos, claves y archivos, conservando los ajustes salvo que se pase `-BorrarAjustes`.

          **Los iconos del escritorio abren el explorador propio** (nuevo en 0.8.0): el doble clic en una carpeta del escritorio (y «Este equipo», y la carpeta del usuario) abre `OptimizedExplorer`, no el Explorador de Windows. Los documentos y los accesos directos siguen yendo al shell, que es quien sabe con qué aplicación abrirlos, igual que la Papelera, Red y el Panel de control, que no son carpetas del disco. Las rutas con espacios ya se pasan entrecomilladas en todos los lanzamientos del explorador propio.

          **Licencia GPL-3.0-or-later**: el código se publica bajo la Licencia Pública General de GNU v3 o posterior (`LICENSE`), y el repositorio es público.

          Los ajustes se guardan en `%APPDATA%\OptimizedShell\config.ini` y se aplican en caliente.

          SHA-256 de `OptimizedShell.exe`:
          `${{ steps.pack.outputs.hash }}`
          '@
          $notes | Out-File notes.md -Encoding utf8
          gh release create "${{ steps.tag.outputs.tag }}" `
            "dist\OptimizedShell-${{ steps.tag.outputs.tag }}-x86_64-windows.zip" `
            "dist\OptimizedShell.exe" `
            "dist\OptimizedShell.exe.sha256" `
            "dist\OptimizedExplorer.exe" `
            "dist\OptimizedTaskmgr.exe" `
            "dist\OptimizedLogonUI.exe" `
            "dist\SHA256SUMS.txt" `
            --title "OptimizedShell ${{ steps.tag.outputs.tag }}" `
            --notes-file notes.md
